# Every night: collect each state's trout stocking data and publish it to GitHub Pages,
# where the BiteCast app downloads it. Also runs on demand from the Actions tab.
name: Collect trout stocking

on:
  schedule:
    - cron: '15 9 * * *' # 5:15 AM Eastern
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect every state
        run: node src/run.mjs
        env:
          # Last night's published files: kept for any state whose site fails tonight.
          PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
